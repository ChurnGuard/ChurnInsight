services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8080
    networks:
      - churninsight-network

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    networks:
      - churninsight-network
    
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8000}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://db:3306/churninsight}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-churnuser}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-churnpass}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_CUSTOMER_MAIL=${SPRING_CUSTOMER_MAIL:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - churninsight-network

  db:
    image: mysql:8.0
    container_name: churninsight-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-churninsight}
      - MYSQL_USER=${MYSQL_USER:-churnuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-churnpass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - churninsight-network

networks:
  churninsight-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
