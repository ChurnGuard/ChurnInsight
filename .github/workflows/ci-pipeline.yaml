name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
     - "backend/src/**"
     - "backend/pom.xml"
     - "backend/Dockerfile"
     - "ml-service/**"
     - "docker-compose.yaml"

     - "!docs/**"
     - "!LICENSE"
     - "!**.md"
     - "!**.png"
     - "!**.drawio"
     - "!data-science/notebooks/**"
     - "!data-science/data/**.csv"
     - "!.gitignore" 
     
jobs:

  build:

    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      
      - name: Build Backend
        run: docker build -t ghcr.io/${{ env.REPO_LC }}/backend:latest ./backend

      - name: Build ML Service
        run: docker build -t ghcr.io/${{ env.REPO_LC }}/ml-service:latest ./ml-service

      - name: GHCR Login
        uses: docker/login-action@v3
        with:  
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Backend Image
        run: docker push ghcr.io/${{ env.REPO_LC }}/backend:latest

      - name: Push ML-Service Image
        run: docker push ghcr.io/${{ env.REPO_LC }}/ml-service:latest
    
