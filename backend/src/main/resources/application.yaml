spring:
  application:
    name: churninsight

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/churninsight}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:churnuser}
    password: ${SPRING_DATASOURCE_PASSWORD:churnpass}

  jpa:
    hibernate:
      ddl-auto: update  # Mantiene el esquema y aplica cambios sin borrar datos
    show-sql: true  # Muestra las queries SQL en consola
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8000}